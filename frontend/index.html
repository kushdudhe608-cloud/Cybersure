<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberSure - Detect Scams Before They Detect You</title>
    <meta name="description" content="CyberSure is an AI-powered scam detection platform for websites, emails, WhatsApp messages, job offers, QR codes and more." />
    <meta name="theme-color" content="#0f1011" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0%25'%20stop-color='%2300B3DD'/%3E%3Cstop%20offset='100%25'%20stop-color='%23847DFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M32%204%20L54%2012%20L54%2030%20C54%2044%2045%2054%2032%2060%20C19%2054%2010%2044%2010%2030%20L10%2012%20Z'%20fill='url(%23g)'/%3E%3Cpath%20d='M21%2032%20L28%2039%20L44%2022'%20fill='none'%20stroke='white'%20stroke-width='5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Origin Financial type system: DM Serif Display (Lyon Display substitute),
         Inter (Suisse Int'l / Suisse Int'l Trial substitute), Roboto Mono (data/labels) -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Tailwind Play CDN, configured to mirror the original tailwind.config.js exactly (no build step) -->
    <script>
      window.tailwind = window.tailwind || {};
      function themeColor(variable) {
        return ({ opacityValue }) =>
          opacityValue === undefined ? `rgb(var(${variable}))` : `rgb(var(${variable}) / ${opacityValue})`;
      }
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: themeColor("--color-background"),
              backgroundAlt: themeColor("--color-background-alt"),
              card: themeColor("--color-card"),
              cardRaised: themeColor("--color-card-raised"),
              primary: themeColor("--color-primary"),
              accent: themeColor("--color-accent"),
              success: themeColor("--color-success"),
              warning: themeColor("--color-warning"),
              danger: themeColor("--color-danger"),
              ink: themeColor("--color-ink"),
              muted: themeColor("--color-muted"),
              onPrimary: themeColor("--color-on-primary"),
              "iris-gleam": "#847dff",
              "cyan-signal": "#00b3dd",
              "pale-iris": "#d1c9ff",
              "deep-iris": "#4b49aa",
              "orchid-bloom": "#dd90d8",
              periwinkle: "#90b8f0",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["DM Serif Display", "ui-serif", "Georgia", "serif"],
              mono: ["Roboto Mono", "ui-monospace", "SFMono-Regular", "monospace"],
            },
            boxShadow: {
              soft: "0 4px 20px rgba(0, 0, 0, 0.25)",
              glow: "0 0 0 1px rgb(var(--color-primary) / 0.15), 0 0 24px -4px rgb(var(--color-primary) / 0.35)",
              glowAccent: "0 0 0 1px rgb(var(--color-accent) / 0.15), 0 0 24px -4px rgb(var(--color-accent) / 0.35)",
              origin: "rgba(0, 0, 0, 0.2) 0px 18px 20px 0px",
            },
            borderRadius: { xl2: "1.25rem", pill: "9999px", feature: "30px" },
            keyframes: {
              pulseSlow: { "0%, 100%": { opacity: 1 }, "50%": { opacity: 0.6 } },
              radarSpin: { "0%": { transform: "rotate(0deg)" }, "100%": { transform: "rotate(360deg)" } },
              ringExpand: { "0%": { transform: "scale(0.6)", opacity: 0.6 }, "100%": { transform: "scale(1.6)", opacity: 0 } },
              blipPulse: { "0%, 100%": { opacity: 0.4, transform: "scale(0.9)" }, "50%": { opacity: 1, transform: "scale(1.15)" } },
              float: { "0%, 100%": { transform: "translateY(0px)" }, "50%": { transform: "translateY(-10px)" } },
              scanline: { "0%": { transform: "translateY(-100%)" }, "100%": { transform: "translateY(100%)" } },
              sweepIn: { "0%": { backgroundPosition: "0% 50%" }, "100%": { backgroundPosition: "100% 50%" } },
            },
            animation: {
              pulseSlow: "pulseSlow 2.5s ease-in-out infinite",
              radarSpin: "radarSpin 6s linear infinite",
              ringExpand: "ringExpand 3s ease-out infinite",
              blipPulse: "blipPulse 2.2s ease-in-out infinite",
              float: "float 5s ease-in-out infinite",
              scanline: "scanline 3s linear infinite",
              sweepIn: "sweepIn 6s ease infinite",
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide icons (same icon set the original React app used via lucide-react) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- Chart.js for the Dashboard (stands in for Recharts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <!-- jsQR for client-side QR decoding -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <link rel="stylesheet" href="css/style.css" />

    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("cybersure-theme");
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-background text-ink">
    <div id="splash"></div>
    <div id="ambient" class="fixed inset-0 -z-10 overflow-hidden pointer-events-none" aria-hidden="true">
      <div class="absolute inset-0 bg-background"></div>
      <div class="absolute inset-0 bg-vignette"></div>
      <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[50rem] h-[26rem] bg-primary/[0.06] rounded-full blur-[140px]"></div>
    </div>
    <div id="toast-root" class="fixed top-4 right-4 z-[200] flex flex-col gap-2 items-end"></div>

    <div id="app-root" class="min-h-screen flex flex-col text-ink">
      <div id="navbar-root"></div>
      <main id="main-root" class="flex-1"></main>
      <div id="footer-root"></div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
